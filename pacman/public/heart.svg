  <rect x="2" y="2" width="2" height="1"/><rect x="7" y="2" width="2" height="1"/>
  <rect x="1" y="3" width="4" height="1"/><rect x="6" y="3" width="4" height="1"/>
  <rect x="1" y="4" width="9" height="2"/>
  <rect x="2" y="6" width="7" height="1"/>
  <rect x="3" y="7" width="5" height="1"/>
  <rect x="4" y="8" width="3" height="1"/>
  <rect x="5" y="9" width="1" height="1"/>
  </g>
  <rect x="2" y="3" width="1" height="1" fill="#ffb7ae"/>
</svg>
