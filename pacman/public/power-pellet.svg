<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" width="26" height="26" shape-rendering="crispEdges">
  <title>Pac-Man power pellet</title>
  <!-- Arcade energizer: fills the full 8x8 tile, corners clipped. -->
  <g fill="#ffb7ae">
    <rect x="2" y="0" width="4" height="1"/>
    <rect x="1" y="1" width="6" height="1"/>
    <rect x="0" y="2" width="8" height="4"/>
    <rect x="1" y="6" width="6" height="1"/>
    <rect x="2" y="7" width="4" height="1"/>
  </g>
</svg>
