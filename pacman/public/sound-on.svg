<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" width="36" height="36" shape-rendering="crispEdges">
  <title>Sound on</title>
  <!-- 12x12 speaker, drawn on the same grid as the fruit sprites. The cone is
       three stepped columns off a 2x2 neck; the two bars to its right are the
       sound waves, and they are what `sound-off.svg` swaps for a cross. -->
  <g fill="#ffff00">
  <rect x="1" y="5" width="2" height="2"/>
  <rect x="3" y="4" width="1" height="4"/>
  <rect x="4" y="3" width="1" height="6"/>
  <rect x="5" y="2" width="1" height="8"/>
  <rect x="7" y="4" width="1" height="4"/>
  <rect x="9" y="3" width="1" height="6"/>
  </g>
</svg>
